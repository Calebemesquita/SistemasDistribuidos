[project]
name = "biblioteca-trabalho3"
version = "0.1.0"
description = "Modelos e serviços de domínio da biblioteca, reutilizados pelo Trabalho 4"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.164.0",
    "pika>=1.4.4",
    "pydantic>=2.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biblioteca_domain", "protocol"]
